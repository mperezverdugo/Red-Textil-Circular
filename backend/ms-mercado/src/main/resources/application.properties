server.port=8082
spring.datasource.url=jdbc:h2:file:./data/mercado
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
mercado.semilla.habilitada=true
mercado.token.secreto=${TOKEN_SECRET:clave-local-de-desarrollo-textil-circular-2026}
mercado.token.duracion=PT1H

# Configuración de memoria y JVM para Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilitar soporte AndroidX moderno
android.useAndroidX=true

# Deshabilitar generación de BuildConfig por defecto en AGP 8+ si no es necesario
android.defaults.buildfeatures.buildconfig=false

# Modo no restrictivo de nombres de Kotlin
kotlin.code.style=official
